server:
  port: 8082

spring:
  docker:
    compose:
      enabled: false   # Disabilita integrazione automatica Docker Compose

  datasource:
    url: jdbc:postgresql://localhost:5432/claimdb
    username: user
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update    # usa 'validate' o 'create' se vuoi altro comportamento
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/insurance
          jwk-set-uri: http://localhost:8080/realms/insurance/protocol/openid-connect/certs

logging:
  level:
    org.springframework.security: DEBUG
