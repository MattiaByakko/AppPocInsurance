spring:
  application:
    name: pocInsurance

  datasource:
    url: jdbc:postgresql://localhost:5432/claimdb
    username: user
    password: password

  docker:
    compose:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080
